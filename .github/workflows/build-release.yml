name: Build and Release AutoBrightnessGuard

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      allow_ephemeral_keystore:
        description: 'Generate a temporary one-off debug keystore if neither debug.keystore.base64 nor DEBUG_KEYSTORE_BASE64 secret exists (breaks in-place updates!)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Debug Keystore
        env:
          KEYSTORE_B64_SECRET: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Using debug.keystore.base64 from repository."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ -n "$KEYSTORE_B64_SECRET" ]; then
            echo "Using DEBUG_KEYSTORE_BASE64 from GitHub Secrets."
            printf '%s' "$KEYSTORE_B64_SECRET" | tr -d '[:space:]' | base64 -d > debug.keystore
          elif [ "${{ github.event.inputs.allow_ephemeral_keystore }}" = "true" ]; then
            echo "WARNING: Generating ephemeral debug.keystore (APK will NOT update cleanly over other builds)."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keypass android -storepass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "::error::Missing debug.keystore.base64 and GitHub Secret DEBUG_KEYSTORE_BASE64. Refusing to generate a random certificate that breaks APK upgrades. Upload debug.keystore.base64 to the repo or set DEBUG_KEYSTORE_BASE64 in GitHub Actions Secrets."
            exit 1
          fi

      - name: Extract App Version
        id: app_version
        run: |
          VER=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release Artifacts
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/AutoBrightnessGuard-${{ steps.app_version.outputs.version }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoBrightnessGuard-${{ steps.app_version.outputs.version }}-APK
          path: app/build/outputs/apk/debug/AutoBrightnessGuard-${{ steps.app_version.outputs.version }}.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/AutoBrightnessGuard-${{ steps.app_version.outputs.version }}.apk
          name: Auto Brightness Guard ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
